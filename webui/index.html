<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-MAGE</title>
<style>
  :root {
    --paper:#F5F7F4; --panel:#FFFFFF; --sunk:#ECF0EB;
    --ink:#141B19; --ink-2:#4E5A56; --ink-3:#78847F;
    --rule:#D3DBD4; --accent:#1B4A6B; --accent-sunk:#E8EEF2;
    --ok:#2F6B52; --ok-sunk:#E3EFE8; --bad:#9E3521; --bad-sunk:#F6E7E3;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont,
            "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0E1413; --panel:#151D1B; --sunk:#1A2422;
      --ink:#E4EAE6; --ink-2:#9DAAA5; --ink-3:#74827C;
      --rule:#27332F; --accent:#74B4D8; --accent-sunk:#152A36;
      --ok:#6FC099; --ok-sunk:#14261E; --bad:#E2836A; --bad-sunk:#2E1A16;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--sans); line-height:1.6;
    display:flex; align-items:center; justify-content:center; padding:2rem 1rem;
  }
  main { width:100%; max-width:560px; display:flex; flex-direction:column; gap:1.4rem; }

  header { border-top:2px solid var(--ink); padding-top:.9rem; }
  h1 { font-family:var(--mono); font-size:1.4rem; font-weight:600; margin:0;
       letter-spacing:-.02em; }
  header p { margin:.2rem 0 0; color:var(--ink-3); font-size:.9rem; }

  /* ---- drop zone ---- */
  #drop {
    border:2px dashed var(--rule); background:var(--panel);
    padding:3rem 1.5rem; text-align:center; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  #drop:hover, #drop:focus-visible { border-color:var(--accent); }
  #drop.over { border-color:var(--accent); background:var(--accent-sunk); }
  #drop.over .hint { color:var(--accent); }
  #drop strong { display:block; font-size:1.05rem; margin-bottom:.3rem; }
  #drop .hint { color:var(--ink-3); font-size:.88rem; }

  /* ---- file list ---- */
  #files { display:none; flex-direction:column; border:1px solid var(--rule);
           background:var(--panel); }
  #files.show { display:flex; }
  .file { display:flex; align-items:center; gap:.6rem; padding:.55rem .9rem;
          border-bottom:1px solid var(--rule); font-size:.9rem; }
  .file:last-child { border-bottom:0; }
  .file .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .sz { font-family:var(--mono); font-size:.75rem; color:var(--ink-3); }
  .file button { border:0; background:none; color:var(--ink-3); cursor:pointer;
                 font-size:1.1rem; line-height:1; padding:0 .2rem; }
  .file button:hover { color:var(--bad); }

  /* ---- output folder ---- */
  .row { display:flex; align-items:center; gap:.8rem; border:1px solid var(--rule);
         background:var(--panel); padding:.7rem .9rem; }
  .row .label { font-family:var(--mono); font-size:.62rem; letter-spacing:.11em;
                text-transform:uppercase; color:var(--ink-3); flex:none;
                align-self:flex-start; padding-top:.15rem; }
  .row button.plain { flex:none; align-self:flex-start; }
  /* Paths wrap rather than being truncated. direction:rtl would keep the tail
     visible but reorders the leading slash, which reads as a broken path. */
  .row .val { flex:1; font-family:var(--mono); font-size:.78rem;
              word-break:break-all; line-height:1.45; }
  button.plain {
    font:inherit; font-size:.82rem; padding:.3rem .7rem; cursor:pointer;
    background:var(--sunk); color:var(--ink); border:1px solid var(--rule);
  }
  button.plain:hover { border-color:var(--accent); color:var(--accent); }

  /* ---- primary action ---- */
  button.go {
    font:inherit; font-weight:600; font-size:1rem; padding:.85rem;
    background:var(--accent); color:var(--paper); border:0; cursor:pointer;
  }
  button.go:disabled { opacity:.4; cursor:default; }

  /* ---- progress ---- */
  #progress { display:none; flex-direction:column; gap:.5rem; }
  #progress.show { display:flex; }
  .step { display:flex; align-items:center; gap:.7rem; padding:.55rem .9rem;
          border:1px solid var(--rule); background:var(--panel); font-size:.92rem; }
  .step .dot { width:1.15rem; text-align:center; font-family:var(--mono);
               font-size:.85rem; color:var(--ink-3); }
  .step.active { border-color:var(--accent); }
  .step.active .dot { color:var(--accent); }
  .step.active .nm { font-weight:600; }
  .step.done .dot { color:var(--ok); }
  .step.done .nm { color:var(--ink-2); }

  #note { font-size:.85rem; color:var(--ink-3); }

  details { font-size:.8rem; color:var(--ink-3); }
  details summary { cursor:pointer; }
  pre { margin:.5rem 0 0; padding:.7rem; background:var(--sunk);
        border:1px solid var(--rule); font-family:var(--mono); font-size:.72rem;
        line-height:1.5; max-height:14rem; overflow:auto; white-space:pre-wrap;
        word-break:break-word; }

  /* ---- result ---- */
  #result { display:none; flex-direction:column; gap:.8rem;
            border:1px solid var(--ok); background:var(--ok-sunk); padding:1.1rem; }
  #result.show { display:flex; }
  #result h2 { margin:0; font-family:var(--mono); font-size:1rem; color:var(--ok); }
  #result .counts { display:flex; gap:1.6rem; }
  #result .counts div { display:flex; flex-direction:column; }
  #result .counts b { font-family:var(--mono); font-size:1.6rem; line-height:1; }
  #result .counts span { font-size:.75rem; color:var(--ink-2); }
  #result .path { font-family:var(--mono); font-size:.72rem; color:var(--ink-2);
                  word-break:break-all; }
  #result .actions { display:flex; gap:.6rem; }

  #error { display:none; border:1px solid var(--bad); background:var(--bad-sunk);
           color:var(--bad); padding:.9rem; font-size:.9rem; }
  #error.show { display:block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>C-MAGE</h1>
    <p>Chemical structure extraction from PDFs</p>
  </header>

  <div id="drop" tabindex="0" role="button" aria-label="Drop PDFs here or click to choose">
    <strong>Drop your PDFs here</strong>
    <span class="hint">or click to choose them</span>
  </div>
  <input id="picker" type="file" accept="application/pdf,.pdf" multiple hidden>

  <div id="files"></div>

  <div class="row">
    <span class="label">Save to</span>
    <span class="val" id="outFolder">…</span>
    <button class="plain" id="changeFolder">Change</button>
  </div>

  <button class="go" id="start" disabled>Extract structures</button>

  <div id="progress">
    <div class="step" data-stage="1"><span class="dot">○</span><span class="nm">Finding figures in the pages</span></div>
    <div class="step" data-stage="2"><span class="dot">○</span><span class="nm">Cutting out the structures</span></div>
    <div class="step" data-stage="3"><span class="dot">○</span><span class="nm">Reading the structures</span></div>
    <p id="note"></p>
    <details><summary>Show details</summary><pre id="logbox"></pre></details>
  </div>

  <div id="error"></div>

  <div id="result">
    <h2>Done</h2>
    <div class="counts">
      <div><b id="cHigh">–</b><span>worth keeping</span></div>
      <div><b id="cLow">–</b><span>to check by eye</span></div>
    </div>
    <div class="path" id="rPath"></div>
    <div class="actions">
      <button class="plain" id="openFolder">Open results folder</button>
      <button class="plain" id="again">Do another</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let queue = [];      // File objects waiting to be sent
let polling = null;

/* ---------- choosing files ---------- */
const drop = $("drop"), picker = $("picker");

drop.addEventListener("click", () => picker.click());
drop.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); }
});
picker.addEventListener("change", () => { addFiles(picker.files); picker.value = ""; });

["dragenter", "dragover"].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t =>
  drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

// Dropping anywhere else in the window should not navigate away from the page.
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

function addFiles(list) {
  const rejected = [];
  for (const f of list) {
    if (!f.name.toLowerCase().endsWith(".pdf")) { rejected.push(f.name); continue; }
    if (!queue.some(q => q.name === f.name && q.size === f.size)) queue.push(f);
  }
  showError(rejected.length
    ? `Skipped ${rejected.length} file(s) that are not PDFs.` : "");
  renderFiles();
}

function renderFiles() {
  const box = $("files");
  box.innerHTML = "";
  queue.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "file";
    const mb = (f.size / 1048576).toFixed(1);
    row.innerHTML = `<span class="nm"></span><span class="sz">${mb} MB</span>
                     <button title="Remove" aria-label="Remove">×</button>`;
    row.querySelector(".nm").textContent = f.name;
    row.querySelector("button").onclick = () => { queue.splice(i, 1); renderFiles(); };
    box.appendChild(row);
  });
  box.classList.toggle("show", queue.length > 0);
  $("start").disabled = queue.length === 0;
  $("start").textContent = queue.length > 1
    ? `Extract structures from ${queue.length} PDFs` : "Extract structures";
}

function showError(msg) {
  const box = $("error");
  box.textContent = msg;
  box.classList.toggle("show", !!msg);
}

/* ---------- output folder ---------- */
$("changeFolder").onclick = async () => {
  $("changeFolder").disabled = true;
  try {
    const r = await fetch("/choose-folder", { method: "POST" });
    const d = await r.json();
    $("outFolder").textContent = d.output_folder;
  } finally { $("changeFolder").disabled = false; }
};

/* ---------- running ---------- */
$("start").onclick = async () => {
  $("start").disabled = true;
  showError("");
  $("result").classList.remove("show");
  $("progress").classList.add("show");
  setNote("Uploading…");

  try {
    await fetch("/reset", { method: "POST" });   // drop anything left staged
    for (const f of queue) {
      const r = await fetch("/upload?name=" + encodeURIComponent(f.name),
                            { method: "POST", body: f });
      if (!r.ok) throw new Error((await r.json()).error || "Upload failed.");
    }
    const r = await fetch("/run", { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).error || "Could not start.");
    queue = []; renderFiles();
    startPolling();
  } catch (err) {
    $("progress").classList.remove("show");
    showError(err.message);
    $("start").disabled = queue.length === 0;
  }
};

function setNote(text) { $("note").textContent = text; }

function startPolling() {
  if (polling) clearInterval(polling);
  polling = setInterval(poll, 1000);
  poll();
}

async function poll() {
  let d;
  try { d = await (await fetch("/status")).json(); } catch { return; }

  $("outFolder").textContent = d.output_folder;
  $("logbox").textContent = (d.lines || []).join("\n");
  $("logbox").scrollTop = $("logbox").scrollHeight;

  document.querySelectorAll(".step").forEach(el => {
    const n = +el.dataset.stage;
    el.classList.toggle("done", d.stage > n || d.state === "done");
    el.classList.toggle("active", d.stage === n && d.state === "running");
    el.querySelector(".dot").textContent =
      (d.stage > n || d.state === "done") ? "✓" : (d.stage === n ? "◐" : "○");
  });

  if (d.state === "running") {
    const secs = d.started ? Math.round(Date.now() / 1000 - d.started) : 0;
    setNote(`Working… ${secs}s elapsed. Roughly 10 seconds per page.`);
  } else if (d.state === "done") {
    stop();
    setNote("");
    $("progress").classList.remove("show");
    $("cHigh").textContent = d.counts ? d.counts.high : "–";
    $("cLow").textContent = d.counts ? d.counts.low : "–";
    $("rPath").textContent = d.results || "";
    $("result").classList.add("show");
    if (d.failed && d.failed.length) {
      showError("Could not read: " + d.failed.join(", ") +
                ". The results below cover the other files.");
    }
  } else if (d.state === "empty") {
    stop();
    setNote("");
    $("progress").classList.remove("show");
    let msg = "No chemical structures were found in that PDF.";
    if (d.failed && d.failed.length) {
      msg = "Could not read: " + d.failed.join(", ") +
            ". The file may be damaged, or not really a PDF.";
    }
    showError(msg);
    $("start").disabled = queue.length === 0;
  } else if (d.state === "error") {
    stop();
    $("progress").classList.remove("show");
    showError(d.message + " Open “Show details” for the full output.");
    $("progress").classList.add("show");
    $("start").disabled = queue.length === 0;
  }
}

function stop() { clearInterval(polling); polling = null; }

/* ---------- result actions ---------- */
$("openFolder").onclick = () => fetch("/reveal");
$("again").onclick = async () => {
  await fetch("/reset", { method: "POST" });
  $("result").classList.remove("show");
  document.querySelectorAll(".step").forEach(el => {
    el.classList.remove("done", "active");
    el.querySelector(".dot").textContent = "○";
  });
  showError("");
};

/* ---------- start ---------- */
poll();
</script>
</body>
</html>
